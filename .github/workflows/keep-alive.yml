name: Keep Render backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping live API
        run: |
          code=$(curl -s -o /tmp/live.json -w "%{http_code}" --max-time 120 https://hkia-live-map.onrender.com/api/live)
          echo "HTTP $code"
          python3 - <<'EOF'
          import json
          try:
              d = json.load(open("/tmp/live.json"))
              print(f"rows: {len(d.get('rows', []))}, ts: {d.get('ts')}")
          except Exception as e:
              print(f"bad payload: {e}")
          EOF
          test "$code" = "200"
