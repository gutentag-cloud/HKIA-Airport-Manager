name: Deploy static map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p site/cesium site/fonts
          cp AirportManager/vhhh_gate_map.html site/index.html
          cp -R AirportManager/vendor/cesium/. site/cesium/
          cp hkia_map_assets/fonts/*.woff2 site/fonts/
          # Make asset URLs relative so they work under the project subpath
          sed -i "s|CESIUM_BASE_URL='/cesium/'|CESIUM_BASE_URL='cesium/'|" site/index.html
          sed -i 's|url(/fonts/|url(fonts/|g' site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
